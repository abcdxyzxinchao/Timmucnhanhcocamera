<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hệ Thống Giám Sát Chuyên Nghiệp 120X</title>
    <style>
        :root {
            --ios-yellow: #ffcc00;
            --ios-dark-bg: #000000;
            --ios-blue: #007aff;
            --ios-gray: #1c1c1e;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
        }

        html, body {
            width: 100%; height: 100dvh; margin: 0; padding: 0;
            background-color: var(--ios-dark-bg); color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; position: fixed;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        .app-container {
            width: 100vw; height: 100dvh; display: flex; flex-direction: column; box-sizing: border-box;
            background: #000; position: relative;
        }

        /* KHU VỰC CAMERA CHUẨN */
        .camera-viewport-wrapper {
            position: relative; width: 100%; background: #000;
            flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none;
            z-index: 10; transition: all 0.3s ease;
        }

        /* LOGIC FULL MÀN HÌNH: ĐẨY LÊN TUYỆT ĐỐI */
        .app-container.is-fullscreen .camera-viewport-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 9999;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            will-change: transform; transition: transform 0.05s ease-out;
        }
        video.mirror-mode { transform: scaleX(-1); }

        /* BỘ ĐẾM THỜI GIAN QUAY VIDEO */
        .video-recording-timer {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9); padding: 4px 14px; font-weight: 700;
            font-size: 14px; border-radius: 8px; display: none; z-index: 10005; color: #fff;
        }

        /* THANH ĐIỀU KHIỂN TRÊN */
        .top-settings-bar {
            position: absolute; top: 16px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; box-sizing: border-box; z-index: 10005;
        }
        .left-controls, .right-controls { display: flex; align-items: center; gap: 8px; }

        .res-badge-select {
            background: rgba(0, 0, 0, 0.6); color: var(--ios-yellow); border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px; font-size: 11px; font-weight: 600; border-radius: 12px; outline: none;
        }
        .btn-icon-top {
            background: rgba(0, 0, 0, 0.6); border: none; color: #fff;
            width: 34px; height: 34px; border-radius: 50%; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon-top.active { background: var(--ios-yellow); color: #000; }

        /* VÒNG XOAY ZOOM LUÔN NỔI */
        .zoom-control-layer {
            position: absolute; bottom: 120px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; z-index: 10005; pointer-events: none;
        }
        .collapsed-zoom-hub { pointer-events: auto; display: flex; justify-content: center; align-items: center; }
        .zoom-single-dot {
            background: rgba(28, 28, 30, 0.9); border: 1px solid rgba(255,255,255,0.25);
            color: var(--ios-yellow); width: 42px; height: 42px; border-radius: 50%;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .ios-curved-dial-panel { position: absolute; bottom: -10px; width: 320px; height: 130px; pointer-events: auto; display: none; opacity: 0; }
        .dial-center-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--ios-yellow); z-index: 150; }
        .dial-live-text-hub { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: var(--ios-yellow); font-size: 14px; font-weight: 700; z-index: 150; background: rgba(0,0,0,0.8); padding: 3px 10px; border-radius: 12px; }
        .dial-wheel-rotor { position: absolute; top: 40px; left: 50%; width: 640px; height: 640px; margin-left: -320px; border-radius: 50%; will-change: transform; }
        .dial-tick-line { position: absolute; top: 0; left: 50%; width: 1.5px; height: 10px; background: rgba(255,255,255,0.3); transform-origin: 50% 320px; }
        .dial-tick-line.major-line { height: 16px; background: rgba(255,255,255,0.85); width: 2px; }
        .dial-tick-line span { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.7); }

        /* THANH ĐÁY ĐIỀU KHIỂN - CHUYỂN DẠNG KÍNH MỜ KHI BẬT FULL MÀN */
        .ios-bottom-dashboard { 
            position: relative; width: 100vw;
            background: #000000; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)) 0; 
            display: flex; flex-direction: column; align-items: center; gap: 12px; 
            box-sizing: border-box; z-index: 10010; transition: all 0.3s ease;
        }
        
        /* Khi bật Full màn hình: Biến đổi thành dạng thanh kính mờ bo góc sang xịn */
        .app-container.is-fullscreen .ios-bottom-dashboard {
            position: fixed; bottom: 16px; left: 5%; width: 90vw;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px 0; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); z-index: 100010;
        }
        
        .camera-mode-scroller { display: flex; gap: 24px; justify-content: center; width: 100%; }
        .mode-item { font-size: 13px; font-weight: 700; color: #8e8e93; letter-spacing: 0.5px; text-transform: uppercase; }
        .mode-item.active { color: var(--ios-yellow); }
        
        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 32px; box-sizing: border-box; }
        .album-preview-placeholder { width: 44px; height: 44px; border-radius: 8px; background: #1c1c1e; border: 2px solid #fff; background-size: cover; background-position: center; }

        .shutter-trigger-btn { border-radius: 50%; border: none; display: none; }
        .btn-photo-snap { width: 58px; height: 58px; background: #ffffff; border: 4px solid #000; box-shadow: 0 0 0 2px #fff; }
        .btn-video-rec { width: 54px; height: 54px; background: #ff3b30; border: 4px solid #000; box-shadow: 0 0 0 2px #fff; }
        .btn-video-rec.recording { border-radius: 10px; transform: scale(0.85); background: #ff3b30; }
        .btn-camera-flip { width: 40px; height: 40px; border-radius: 50%; background: #1c1c1e; border: none; display: flex; align-items: center; justify-content: center; }
        .btn-camera-flip svg { width: 20px; height: 20px; fill: #ffffff; }

        /* MODAL THƯ VIỆN & CƠ CHẾ TÍCH CHỌN HÀNG LOẠT */
        .gallery-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.98); z-index: 20000; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
        .gallery-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #2c2c2e; }
        .gallery-header-buttons { display: flex; gap: 8px; }
        .btn-gallery-close { background: none; border: none; color: var(--ios-blue); font-size: 15px; font-weight: bold; }
        .gallery-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; overflow-y: auto; }
        
        .gallery-item { position: relative; aspect-ratio: 1; background: #1c1c1e; overflow: hidden; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Hiện vòng tròn nhỏ trên TẤT CẢ các ảnh khi kích hoạt chế độ chọn */
        .gallery-item-checkbox {
            position: absolute; top: 8px; right: 8px; width: 22px; height: 22px;
            border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); background: rgba(0,0,0,0.3);
            display: none; z-index: 10; box-sizing: border-box; transition: all 0.1s ease;
        }
        .gallery-item.select-mode .gallery-item-checkbox { display: block; }
        /* Khi được chọn: Hiện màu xanh và dấu tích trắng */
        .gallery-item.selected .gallery-item-checkbox { 
            background: var(--ios-blue); border-color: var(--ios-blue);
        }
        .gallery-item.selected .gallery-item-checkbox::after {
            content: ''; position: absolute; left: 6px; top: 3px; width: 5px; height: 9px;
            border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
        }

        /* Nhãn hiển thị thời gian quay của Video */
        .video-duration-badge {
            position: absolute; bottom: 6px; left: 6px;
            background: rgba(0, 0, 0, 0.7); color: #fff; font-size: 11px;
            font-weight: 600; padding: 2px 6px; border-radius: 4px; z-index: 5;
        }

        /* THANH ĐÁY ĐIỀU KHIỂN CHỌN HÀNG LOẠT VÀ LƯU */
        .gallery-footer-actions { display: none; background: #1c1c1e; padding: 12px 16px; justify-content: space-between; border-top: 1px solid #2c2c2e; gap: 10px; }
        .btn-footer-action { flex: 1; border: none; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 8px; color: white; text-align: center; }

        /* POPUP XEM CHI TIẾT */
        .detail-viewer-popup { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: #000; z-index: 30000; display: none; flex-direction: column; }
        .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; z-index: 30001; }
        .viewer-content-pane { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .viewer-content-pane img, .viewer-content-pane video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .btn-save-media { background: var(--ios-green); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container" id="mainAppStructure">
    <div class="camera-viewport-wrapper" id="cameraBox">
        <div class="top-settings-bar">
            <div class="left-controls">
                <select id="resSelector" class="res-badge-select" onchange="restartStream()">
                    <option value="8K">8K Ultra HD</option>
                    <option value="4K">4K Super HD</option>
                    <option value="1080p" selected>1080p FHD</option>
                </select>
            </div>
            <div class="right-controls">
                <button class="btn-icon-top active" id="btnCamPower" onclick="toggleCamPower()">👁‍🗨</button>
                <button class="btn-icon-top" id="btnFlash" onclick="toggleFlash()" disabled>⚡</button>
                <button class="btn-icon-top" onclick="toggleFullscreen()">⛶</button>
            </div>
        </div>

        <div class="video-recording-timer" id="recTimer">00:00</div>
        <video id="videoFeed" autoplay playsinline muted></video>

        <div class="zoom-control-layer">
            <div class="collapsed-zoom-hub" id="collapsedZoomHub">
                <button class="zoom-single-dot" id="zoomSingleDot" onclick="openCurvedDial()">1x</button>
            </div>
            <div class="ios-curved-dial-panel" id="curvedDialPanel">
                <div class="dial-center-pointer"></div>
                <div class="dial-live-text-hub" id="liveZoomTxt">1.0x</div>
                <div class="dial-wheel-rotor" id="dialRotor"></div>
            </div>
        </div>
    </div>

    <div class="ios-bottom-dashboard" id="bottomDashboard">
        <div class="camera-mode-scroller">
            <div class="mode-item" id="mode-video" onclick="switchCameraMode('VIDEO')">Video</div>
            <div class="mode-item active" id="mode-photo" onclick="switchCameraMode('PHOTO')">Ảnh</div>
        </div>

        <div class="shutter-row">
            <div class="album-preview-placeholder" id="albumPreview" onclick="openGalleryModal()"></div>
            <button class="shutter-trigger-btn btn-photo-snap" id="btnCapture" onclick="takePhoto()"></button>
            <button class="shutter-trigger-btn btn-video-rec" id="btnRecord" onclick="toggleRecording()"></button>
            <button class="btn-camera-flip" onclick="flipCameraFacing()">
                <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="gallery-modal" id="galleryModal">
    <div class="gallery-header">
        <button class="btn-gallery-close" id="btnCancelSelect" onclick="exitSelectMode()" style="display:none; color:var(--ios-red);">Huỷ chọn</button>
        <div id="galleryTitle" style="font-weight:600; font-size: 16px;">Thư viện ảnh</div>
        <div class="gallery-header-buttons" id="batchToggleActionButtons" style="display: none;">
            <button class="btn-gallery-close" onclick="selectAllMediaItems(true)">Chọn hết</button>
            <button class="btn-gallery-close" onclick="selectAllMediaItems(false)" style="color:#8e8e93;">Bỏ chọn hết</button>
        </div>
        <button class="btn-gallery-close" id="btnCloseGal" onclick="closeGalleryModal()">Xong</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
    
    <div class="gallery-footer-actions" id="galleryFooter">
        <button class="btn-footer-action" style="background:var(--ios-blue);" onclick="downloadSelectedMediaBatch()">📥 Lưu mục đã chọn</button>
        <button class="btn-footer-action" style="background:var(--ios-red);" onclick="deleteSelectedMedia()">🗑 Xóa đã chọn</button>
    </div>
</div>

<div class="detail-viewer-popup" id="detailViewer">
    <div class="viewer-header">
        <button class="btn-gallery-close" onclick="closeDetailViewer()" style="color:#fff; font-size:18px;">✕ Đóng</button>
        <button class="btn-save-media" id="btnSaveMedia" onclick="downloadCurrentMedia()">📥 Lưu về máy</button>
    </div>
    <div class="viewer-content-pane" id="viewerContentPane"></div>
</div>

<script>
    let currentZoom = 1.0;
    let facingModeSetting = "environment";
    let activeMode = "PHOTO";
    let mediaItems = []; 
    let currentViewingItem = null;
    
    let isGallerySelectMode = false;
    let selectedMediaIds = new Set();
    let videoSecondsCounter = 0;

    const dialRotor = document.getElementById('dialRotor');
    const totalTicks = 120; 
    const tickSpacingAngle = 1.5;
    let startX = 0, baseAngle = 0, currentAngle = 0, collapseTimer = null;

    function buildDialTicks() {
        dialRotor.innerHTML = '';
        for (let i = 0; i <= totalTicks; i++) {
            let internalZoom = 1 + (i / totalTicks) * 119; 
            const tick = document.createElement('div');
            tick.className = 'dial-tick-line';
            if (i % 20 === 0) {
                tick.classList.add('major-line');
                tick.innerHTML = `<span>${Math.round(internalZoom)}x</span>`;
            } else if (i % 5 === 0) {
                tick.classList.add('major-line');
            }
            let calculatedAngle = (i - totalTicks / 2) * tickSpacingAngle;
            tick.style.transform = `rotate(${calculatedAngle}deg)`;
            dialRotor.appendChild(tick);
        }
    }

    const zoomSingleDot = document.getElementById('zoomSingleDot');
    const collapsedHub = document.getElementById('collapsedZoomHub');
    const curvedPanel = document.getElementById('curvedDialPanel');

    function openCurvedDial() {
        clearTimeout(collapseTimer);
        collapsedHub.style.opacity = '0';
        curvedPanel.style.display = 'block';
        setTimeout(() => { curvedPanel.style.opacity = '1'; }, 20);
        let fraction = (currentZoom - 1) / 119;
        currentAngle = -(fraction * totalTicks - totalTicks / 2) * tickSpacingAngle;
        dialRotor.style.transform = `rotate(${currentAngle}deg)`;
        document.getElementById('liveZoomTxt').innerText = currentZoom.toFixed(1) + "x";
    }

    function startCollapseCountdown() {
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
            curvedPanel.style.opacity = '0';
            setTimeout(() => {
                curvedPanel.style.display = 'none';
                collapsedHub.style.opacity = '1';
                zoomSingleDot.innerText = currentZoom.toFixed(1) + "x";
            }, 200);
        }, 1500);
    }

    curvedPanel.addEventListener('touchstart', (e) => { clearTimeout(collapseTimer); startX = e.touches[0].clientX; baseAngle = currentAngle; }, { passive: true });
    curvedPanel.addEventListener('touchmove', (e) => {
        let deltaX = e.touches[0].clientX - startX;
        let angleShift = (deltaX / window.innerWidth) * 140;
        currentAngle = baseAngle + angleShift;
        let borderAngle = (totalTicks / 2) * tickSpacingAngle;
        if (currentAngle > borderAngle) currentAngle = borderAngle;
        if (currentAngle < -borderAngle) currentAngle = -borderAngle;
        dialRotor.style.transform = `rotate(${currentAngle}deg)`;
        let ratio = 0.5 - (currentAngle / (totalTicks * tickSpacingAngle));
        let computedZoom = 1 + ratio * 119;
        currentZoom = parseFloat(Math.max(1.0, Math.min(120.0, computedZoom)).toFixed(1));
        document.getElementById('liveZoomTxt').innerText = currentZoom + "x";
        applyHardwareAndDigitalZoom(currentZoom);
    }, { passive: true });
    curvedPanel.addEventListener('touchend', startCollapseCountdown);

    async function applyHardwareAndDigitalZoom(zoomVal) {
        const video = document.getElementById('videoFeed');
        if (videoTrack) {
            try {
                const caps = videoTrack.getCapabilities();
                if (caps.zoom) {
                    const target = caps.min + ((caps.max - caps.min) * (Math.min(zoomVal, caps.max) / caps.max));
                    await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
                }
            } catch(e) {}
        }
        let scaleStr = `scale(${zoomVal})`;
        if (facingModeSetting === "user") { scaleStr += ` scaleX(-1)`; }
        video.style.transform = scaleStr;
    }

    function switchCameraMode(targetMode) {
        if(isRecording) return;
        activeMode = targetMode;
        document.getElementById('mode-video').classList.toggle('active', targetMode === 'VIDEO');
        document.getElementById('mode-photo').classList.toggle('active', targetMode === 'PHOTO');
        document.getElementById('btnCapture').style.display = (targetMode === 'PHOTO') ? 'block' : 'none';
        document.getElementById('btnRecord').style.display = (targetMode === 'VIDEO') ? 'block' : 'none';
    }

    let activeStream = null, videoTrack = null, isFlashOn = false, mediaRecorder = null, recordedChunks = [], isRecording = false, recTimerInterval = null;

    async function startCamera() {
        if (activeStream) { stopCamera(); }
        const video = document.getElementById('videoFeed');
        const mode = document.getElementById('resSelector').value;
        let w = 1920, h = 1080;
        if (mode === '8K') { w = 7680; h = 4320; }
        else if (mode === '4K') { w = 3840; h = 2160; }

        try {
            activeStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: facingModeSetting }, width: { ideal: w }, height: { ideal: h } },
                audio: true 
            });
            video.srcObject = activeStream;
            videoTrack = activeStream.getVideoTracks()[0];
            if (facingModeSetting === "user") { video.classList.add('mirror-mode'); } else { video.classList.remove('mirror-mode'); }
            const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            document.getElementById('btnFlash').disabled = !caps.torch;
            switchCameraMode(activeMode);
            applyHardwareAndDigitalZoom(currentZoom);
        } catch (err) {}
    }

    function stopCamera() {
        if (activeStream) { activeStream.getTracks().forEach(track => track.stop()); activeStream = null; }
        videoTrack = null; isFlashOn = false;
        document.getElementById('videoFeed').srcObject = null;
    }

    function toggleCamPower() { if (activeStream) { stopCamera(); document.getElementById('btnCamPower').classList.remove('active'); } else { startCamera(); document.getElementById('btnCamPower').classList.add('active'); } }
    function restartStream() { if (activeStream) startCamera(); }
    function flipCameraFacing() { facingModeSetting = (facingModeSetting === "environment") ? "user" : "environment"; if (activeStream) startCamera(); }

    async function toggleFlash() {
        if (!videoTrack) return;
        try {
            isFlashOn = !isFlashOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
            document.getElementById('btnFlash').classList.toggle('active', isFlashOn);
        } catch (e) {}
    }

    // SỬA LỖI NÚT FULL MÀN HÌNH: Ép class chuẩn vào khung cha để ăn CSS dạng kính mờ
    function toggleFullscreen() { 
        document.getElementById('mainAppStructure').classList.toggle('is-fullscreen'); 
    }

    function takePhoto() {
        if (!activeStream) return;
        const video = document.getElementById('videoFeed');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        if (facingModeSetting === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        
        let item = { id: Date.now(), type: 'PHOTO', src: dataUrl, duration: '' };
        mediaItems.unshift(item);
        updateAlbumPreview();
    }

    function toggleRecording() {
        if (!activeStream) return;
        const btn = document.getElementById('btnRecord');
        const timerEl = document.getElementById('recTimer');
        
        if (!isRecording) {
            recordedChunks = [];
            videoSecondsCounter = 0;
            mediaRecorder = new MediaRecorder(activeStream, { mimeType: 'video/mp4' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);
                
                // Tính toán chuỗi thời gian quay để gán vào thumbnail
                let finalM = Math.floor(videoSecondsCounter / 60).toString().padStart(2, '0');
                let finalS = (videoSecondsCounter % 60).toString().padStart(2, '0');
                let timeString = `${finalM}:${finalS}`;

                let item = { id: Date.now(), type: 'VIDEO', src: videoUrl, duration: timeString };
                mediaItems.unshift(item);
                updateAlbumPreview(); 
            };
            
            mediaRecorder.start(); 
            isRecording = true; 
            btn.classList.add('recording');
            
            timerEl.style.display = 'block';
            timerEl.innerText = "00:00";
            recTimerInterval = setInterval(() => {
                videoSecondsCounter++;
                let m = Math.floor(videoSecondsCounter / 60).toString().padStart(2, '0');
                let s = (videoSecondsCounter % 60).toString().padStart(2, '0');
                timerEl.innerText = `${m}:${s}`;
            }, 1000);
        } else {
            mediaRecorder.stop(); 
            isRecording = false; 
            btn.classList.remove('recording');
            clearInterval(recTimerInterval);
            timerEl.style.display = 'none';
        }
    }

    function updateAlbumPreview() {
        const preview = document.getElementById('albumPreview');
        if (mediaItems.length > 0) {
            preview.style.backgroundImage = `url('${mediaItems[0].src}')`;
        } else {
            preview.style.backgroundImage = 'none';
        }
    }

    function openGalleryModal() { renderGalleryGrid(); document.getElementById('galleryModal').style.display = 'flex'; }
    function closeGalleryModal() { exitSelectMode(); document.getElementById('galleryModal').style.display = 'none'; }
    
    // LOGIC RENDER THƯ VIỆN: HIỆN SẴN CHECKBOX VÀ THỜI GIAN THEO YÊU CẦU CỦA BẠN
    function renderGalleryGrid() {
        const grid = document.getElementById('galleryGrid'); grid.innerHTML = '';
        mediaItems.forEach(item => {
            const div = document.createElement('div'); 
            div.className = `gallery-item ${isGallerySelectMode ? 'select-mode' : ''} ${selectedMediaIds.has(item.id) ? 'selected' : ''}`;
            
            // Render nội dung Ảnh hoặc Video
            if(item.type === 'PHOTO') {
                div.innerHTML = `<img src="${item.src}">`;
            } else {
                // Nếu là Video $\rightarrow$ Thêm nhãn ghi số thời gian quay ở góc dưới thumbnail
                div.innerHTML = `
                    <video src="${item.src}"></video>
                    <div class="video-duration-badge">📹 ${item.duration}</div>
                `;
            }
            
            // Vòng tròn nhỏ hiển thị trên ảnh để tích
            const chk = document.createElement('div');
            chk.className = 'gallery-item-checkbox';
            div.appendChild(chk);

            let pressTimer;
            // Nhấn giữ (Long Press) 1 giây để lột trần toàn bộ nút tích của các ảnh khác
            div.addEventListener('touchstart', () => {
                pressTimer = setTimeout(() => {
                    if (!isGallerySelectMode) {
                        isGallerySelectMode = true;
                        enterSelectMode();
                    }
                    toggleSelectMediaItem(item.id, div);
                }, 1000);
            }, {passive: true});

            div.addEventListener('touchend', () => { clearTimeout(pressTimer); });

            div.onclick = () => {
                if (isGallerySelectMode) {
                    toggleSelectMediaItem(item.id, div);
                } else {
                    openDetailViewer(item);
                }
            };

            grid.appendChild(div);
        });
    }

    function enterSelectMode() {
        document.getElementById('btnCancelSelect').style.display = 'block';
        document.getElementById('btnCloseGal').style.display = 'none';
        document.getElementById('galleryTitle').style.display = 'none';
        document.getElementById('batchToggleActionButtons').style.display = 'flex';
        document.getElementById('galleryFooter').style.display = 'flex';
        renderGalleryGrid();
    }

    function exitSelectMode() {
        isGallerySelectMode = false;
        selectedMediaIds.clear();
        document.getElementById('btnCancelSelect').style.display = 'none';
        document.getElementById('btnCloseGal').style.display = 'block';
        document.getElementById('galleryTitle').style.display = 'block';
        document.getElementById('batchToggleActionButtons').style.display = 'none';
        document.getElementById('galleryFooter').style.display = 'none';
        renderGalleryGrid();
    }

    function toggleSelectMediaItem(id, element) {
        if (selectedMediaIds.has(id)) {
            selectedMediaIds.delete(id);
            element.classList.remove('selected');
        } else {
            selectedMediaIds.add(id);
            element.classList.add('selected');
        }
    }

    // Logic Tích hết và Bỏ tích hết bằng nút trên thanh Header
    function selectAllMediaItems(status) {
        selectedMediaIds.clear();
        if(status) {
            mediaItems.forEach(item => selectedMediaIds.add(item.id));
        }
        renderGalleryGrid();
    }

    // Tải xuống hàng loạt các video / ảnh được chọn cùng lúc
    function downloadSelectedMediaBatch() {
        if (selectedMediaIds.size === 0) return;
        mediaItems.forEach(item => {
            if(selectedMediaIds.has(item.id)) {
                const a = document.createElement('a');
                a.href = item.src;
                a.download = item.type === 'PHOTO' ? `IMG_${item.id}.jpg` : `VID_${item.id}.mp4`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        });
        exitSelectMode();
    }

    function deleteSelectedMedia() {
        if (selectedMediaIds.size === 0) return;
        mediaItems = mediaItems.filter(item => !selectedMediaIds.has(item.id));
        exitSelectMode();
        updateAlbumPreview();
    }

    function openDetailViewer(item) {
        currentViewingItem = item;
        const pane = document.getElementById('viewerContentPane');
        pane.innerHTML = item.type === 'PHOTO' ? `<img src="${item.src}">` : `<video src="${item.src}" controls autoplay></video>`;
        document.getElementById('detailViewer').style.display = 'flex';
    }

    function closeDetailViewer() { document.getElementById('detailViewer').style.display = 'none'; }

    function downloadCurrentMedia() {
        if (!currentViewingItem) return;
        const a = document.createElement('a');
        a.href = currentViewingItem.src;
        a.download = currentViewingItem.type === 'PHOTO' ? `IMG_${currentViewingItem.id}.jpg` : `VID_${currentViewingItem.id}.mp4`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    window.onload = () => { buildDialTicks(); startCamera(); };
</script>
</body>
</html>
