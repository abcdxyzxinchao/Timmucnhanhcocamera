<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hệ Thống Giám Sát Chuyên Nghiệp 120X</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --ios-yellow: #ffcc00;
            --ios-dark-bg: #000000;
            --ios-blue: #007aff;
            --ios-gray: #1c1c1e;
        }

        html, body {
            width: 100%; 
            height: 100dvh; /* Sử dụng dvh để chống thanh công cụ Safari đè */
            margin: 0; padding: 0;
            background-color: var(--ios-dark-bg); color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; position: fixed;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }

        /* CONTAINER CHÍNH CỐ ĐỊNH THEO DYNAMIC VIEWPORT */
        .app-container {
            width: 100vw; 
            height: 100dvh; /* Khóa chặt chiều cao theo Safari thực tế */
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box;
            padding-bottom: env(safe-area-inset-bottom); 
            background: #000;
        }

        /* VÙNG CAMERA TỈ LỆ 42% VIEWPORT */
        .camera-viewport-wrapper {
            position: relative; width: 100%; background: #000;
            height: 42dvh; overflow: hidden; touch-action: none; flex-shrink: 0;
        }
        .camera-viewport-wrapper.is-fullscreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 9999;
        }

        video {
            width: 100%; height: 100%; object-fit: cover;
            will-change: transform; transition: transform 0.05s ease-out;
        }
        video.mirror-mode { transform: scaleX(-1); }

        .video-recording-timer {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 59, 48, 0.9); padding: 4px 14px; font-weight: 700;
            font-size: 14px; border-radius: 8px; display: none; z-index: 10005;
        }

        .top-settings-bar {
            position: absolute; top: 12px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; box-sizing: border-box; z-index: 10000;
        }
        .left-controls, .right-controls { display: flex; align-items: center; gap: 8px; }

        .res-badge-select {
            background: rgba(0, 0, 0, 0.6); color: var(--ios-yellow); border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 10px; font-size: 11px; font-weight: 600; border-radius: 12px; outline: none;
        }
        .btn-icon-top {
            background: rgba(0, 0, 0, 0.6); border: none; color: #fff;
            width: 34px; height: 34px; border-radius: 50%; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-icon-top.active { background: var(--ios-yellow); color: #000; }

        /* THANH ZOOM 120X CŨ */
        .zoom-control-layer {
            position: absolute; bottom: 10px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center; z-index: 10000; pointer-events: none;
        }
        .collapsed-zoom-hub { pointer-events: auto; display: flex; justify-content: center; align-items: center; }
        .zoom-single-dot {
            background: rgba(28, 28, 30, 0.85); border: 1px solid rgba(255,255,255,0.2);
            color: var(--ios-yellow); width: 40px; height: 40px; border-radius: 50%;
            font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
        }

        .ios-curved-dial-panel { position: absolute; bottom: -10px; width: 320px; height: 130px; pointer-events: auto; display: none; opacity: 0; }
        .dial-center-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--ios-yellow); z-index: 150; }
        .dial-live-text-hub { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: var(--ios-yellow); font-size: 14px; font-weight: 700; z-index: 150; background: rgba(0,0,0,0.7); padding: 3px 10px; border-radius: 12px; }
        .dial-wheel-rotor { position: absolute; top: 40px; left: 50%; width: 640px; height: 640px; margin-left: -320px; border-radius: 50%; will-change: transform; }
        .dial-tick-line { position: absolute; top: 0; left: 50%; width: 1.5px; height: 10px; background: rgba(255,255,255,0.3); transform-origin: 50% 320px; }
        .dial-tick-line.major-line { height: 16px; background: rgba(255,255,255,0.85); width: 2px; }
        .dial-tick-line span { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.7); }

        /* KHU VỰC BẢNG DỮ LIỆU TỰ ĐỘNG CO GIÃN PHẦN GIỮA */
        .data-management-panel { 
            flex: 1; 
            background: #ffffff; 
            color: #1c1c1e; 
            padding: 8px 12px;
            border-top-left-radius: 16px; 
            border-top-right-radius: 16px; 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            box-sizing: border-box;
        }
        .upload-dashed-box { border: 2px dashed #c7c7cc; padding: 16px; text-align: center; border-radius: 12px; background: #f2f2f7; cursor: pointer; }
        
        /* THANH TÌM KIẾM ĐƯỢC CHÈN TRỰC TIẾP TRONG PANEL */
        .search-embed-container {
            display: none; 
            flex-direction: column;
            gap: 6px;
            background: #f2f2f7;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .search-row-top { display: flex; gap: 6px; align-items: center; }
        .ios-search-input {
            flex: 1; background: #ffffff; border: 1px solid #d1d1d6; padding: 8px 12px;
            border-radius: 8px; font-size: 13px; color: #000; outline: none;
        }
        .btn-close-search { background: none; border: none; color: #ff3b30; font-size: 16px; font-weight: bold; padding: 0 4px; }
        
        .filter-buttons-group { display: flex; gap: 6px; }
        .btn-toggle-action {
            flex: 1; border: none; padding: 8px; font-size: 12px; font-weight: 600;
            border-radius: 8px; background: #ffffff; color: #007aff; border: 1px solid #d1d1d6;
        }
        .btn-toggle-action.active { background: #007aff; color: #ffffff; border-color: #007aff; }

        /* VÙNG CUỘN EXCEL - CỐ ĐỊNH TIÊU ĐỀ TUYỆT ĐỐI */
        .grid-table-scroll { 
            flex: 1; 
            overflow: auto; 
            border: 1px solid #e5e5ea; 
            border-radius: 8px; 
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }
        
        th { 
            background: #f2f2f7; color: #000; font-size: 11px; padding: 8px; 
            position: sticky; top: 0; border-bottom: 1px solid #d1d1d6; z-index: 10; 
        }
        td { padding: 8px; border-bottom: 1px solid #e5e5ea; font-size: 11px; text-align: center; color: #000; white-space: nowrap; }

        /* THANH ĐIỀU KHIỂN ĐÁY - KHÓA CHẶT Ở ĐÁY SAFARI KHÔNG BỊ ĐÈ */
        .ios-bottom-dashboard { 
            background: #000000; 
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom)) 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 6px; 
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .camera-viewport-wrapper.is-fullscreen ~ .ios-bottom-dashboard { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.6); }
        .camera-mode-scroller { display: flex; gap: 20px; justify-content: center; width: 100%; }
        .mode-item { font-size: 12px; font-weight: 700; color: #8e8e93; letter-spacing: 0.5px; text-transform: uppercase; }
        .mode-item.active { color: var(--ios-yellow); }
        
        .shutter-row { width: 100%; display: flex; justify-content: space-around; align-items: center; padding: 0 24px; box-sizing: border-box; }
        .album-preview-placeholder { width: 42px; height: 42px; border-radius: 8px; background: #1c1c1e; border: 2px solid #fff; background-size: cover; background-position: center; }

        .shutter-trigger-btn { border-radius: 50%; border: none; display: none; }
        .btn-photo-snap { width: 56px; height: 56px; background: #ffffff; border: 4px solid #000; box-shadow: 0 0 0 2px #fff; }
        .btn-video-rec { width: 52px; height: 52px; background: #ff3b30; border: 4px solid #000; box-shadow: 0 0 0 2px #fff; }
        .btn-video-rec.recording { border-radius: 10px; transform: scale(0.85); background: #ff3b30; }
        .btn-camera-flip { width: 38px; height: 38px; border-radius: 50%; background: #1c1c1e; border: none; display: flex; align-items: center; justify-content: center; }
        .btn-camera-flip svg { width: 18px; height: 18px; fill: #ffffff; }

        .gallery-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: rgba(0,0,0,0.98); z-index: 20000; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; }
        .gallery-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #2c2c2e; }
        .btn-gallery-close { background: none; border: none; color: var(--ios-blue); font-size: 16px; font-weight: bold; }
        .gallery-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; overflow-y: auto; }
        .gallery-item { position: relative; aspect-ratio: 1; background: #1c1c1e; overflow: hidden; }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container" onclick="handleBlankClick(event)">
    <div class="camera-viewport-wrapper" id="cameraBox">
        <div class="top-settings-bar">
            <div class="left-controls">
                <select id="resSelector" class="res-badge-select" onchange="restartStream()">
                    <option value="8K">8K Ultra HD</option>
                    <option value="4K">4K Super HD</option>
                    <option value="1080p" selected>1080p FHD</option>
                </select>
            </div>
            <div class="right-controls">
                <button class="btn-icon-top" id="btnToggleSearch" onclick="event.stopPropagation(); toggleSearchContainer()">🔍</button>
                <button class="btn-icon-top active" id="btnCamPower" onclick="toggleCamPower()">👁‍🗨</button>
                <button class="btn-icon-top" id="btnFlash" onclick="toggleFlash()" disabled>⚡</button>
                <button class="btn-icon-top" onclick="toggleFullscreen()">⛶</button>
            </div>
        </div>

        <div class="video-recording-timer" id="recTimer">00:00</div>
        <video id="videoFeed" autoplay playsinline muted></video>

        <div class="zoom-control-layer">
            <div class="collapsed-zoom-hub" id="collapsedZoomHub">
                <button class="zoom-single-dot" id="zoomSingleDot" onclick="openCurvedDial()">1x</button>
            </div>
            <div class="ios-curved-dial-panel" id="curvedDialPanel">
                <div class="dial-center-pointer"></div>
                <div class="dial-live-text-hub" id="liveZoomTxt">1.0x</div>
                <div class="dial-wheel-rotor" id="dialRotor"></div>
            </div>
        </div>
    </div>

    <div class="data-management-panel" id="dataPanel" onclick="event.stopPropagation()">
        <div class="upload-dashed-box" id="uploadBox" onclick="document.getElementById('excelFile').click()">
            <span style="font-size: 13px; font-weight: 600;">📊 Nạp tập tin dữ liệu phòng thi Excel</span>
            <input type="file" id="excelFile" class="hidden" accept=".xlsx, .xls, .csv">
        </div>
        
        <div class="search-embed-container" id="searchContainer">
            <div class="search-row-top">
                <input type="text" id="searchInput" class="ios-search-input" placeholder="Nhập từ khóa tìm kiếm dữ liệu..." oninput="filterData()">
                <button class="btn-close-search" onclick="closeSearchContainer()">✕</button>
            </div>
            <div class="filter-buttons-group">
                <button class="btn-toggle-action" id="btnSTT" onclick="toggleSTTMode()">Bật STT liên tiếp</button>
                <button class="btn-toggle-action" id="btnGroup" onclick="toggleGroupMode()">Nhóm trùng chung</button>
            </div>
        </div>
        
        <div class="grid-table-scroll" id="tableSection" style="display: none;">
            <table id="dataTable">
                <thead id="tHead"></thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>
    </div>

    <div class="ios-bottom-dashboard" onclick="event.stopPropagation()">
        <div class="camera-mode-scroller">
            <div class="mode-item" id="mode-video" onclick="switchCameraMode('VIDEO')">Video</div>
            <div class="mode-item active" id="mode-photo" onclick="switchCameraMode('PHOTO')">Ảnh</div>
        </div>

        <div class="shutter-row">
            <div class="album-preview-placeholder" id="albumPreview" onclick="openGalleryModal()"></div>
            <button class="shutter-trigger-btn btn-photo-snap" id="btnCapture" onclick="takePhoto()"></button>
            <button class="shutter-trigger-btn btn-video-rec" id="btnRecord" onclick="toggleRecording()"></button>
            <button class="btn-camera-flip" onclick="flipCameraFacing()">
                <svg viewBox="0 0 24 24"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="gallery-modal" id="galleryModal">
    <div class="gallery-header">
        <div style="font-weight:600; font-size: 16px;">Thư viện ảnh</div>
        <button class="btn-gallery-close" onclick="closeGalleryModal()">Xong</button>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
</div>

<script>
    let currentZoom = 1.0;
    let facingModeSetting = "environment";
    let activeMode = "PHOTO";
    let mediaItems = []; 
    
    let originalExcelHeaders = [];
    let originalExcelRows = [];
    
    let isSTTActive = false;
    let isGroupActive = false;

    const dialRotor = document.getElementById('dialRotor');
    const totalTicks = 120; 
    const tickSpacingAngle = 1.5;
    let startX = 0, baseAngle = 0, currentAngle = 0, collapseTimer = null;

    function buildDialTicks() {
        dialRotor.innerHTML = '';
        for (let i = 0; i <= totalTicks; i++) {
            let internalZoom = 1 + (i / totalTicks) * 119; 
            const tick = document.createElement('div');
            tick.className = 'dial-tick-line';
            if (i % 20 === 0) {
                tick.classList.add('major-line');
                tick.innerHTML = `<span>${Math.round(internalZoom)}x</span>`;
            } else if (i % 5 === 0) {
                tick.classList.add('major-line');
            }
            let calculatedAngle = (i - totalTicks / 2) * tickSpacingAngle;
            tick.style.transform = `rotate(${calculatedAngle}deg)`;
            dialRotor.appendChild(tick);
        }
    }

    const zoomSingleDot = document.getElementById('zoomSingleDot');
    const collapsedHub = document.getElementById('collapsedZoomHub');
    const curvedPanel = document.getElementById('curvedDialPanel');

    function openCurvedDial() {
        clearTimeout(collapseTimer);
        collapsedHub.style.opacity = '0';
        curvedPanel.style.display = 'block';
        setTimeout(() => { curvedPanel.style.opacity = '1'; }, 20);
        let fraction = (currentZoom - 1) / 119;
        currentAngle = -(fraction * totalTicks - totalTicks / 2) * tickSpacingAngle;
        dialRotor.style.transform = `rotate(${currentAngle}deg)`;
        document.getElementById('liveZoomTxt').innerText = currentZoom.toFixed(1) + "x";
    }

    function startCollapseCountdown() {
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
            curvedPanel.style.opacity = '0';
            setTimeout(() => {
                curvedPanel.style.display = 'none';
                collapsedHub.style.opacity = '1';
                zoomSingleDot.innerText = currentZoom.toFixed(1) + "x";
            }, 200);
        }, 1500);
    }

    curvedPanel.addEventListener('touchstart', (e) => { clearTimeout(collapseTimer); startX = e.touches[0].clientX; baseAngle = currentAngle; }, { passive: true });
    curvedPanel.addEventListener('touchmove', (e) => {
        let deltaX = e.touches[0].clientX - startX;
        let angleShift = (deltaX / window.innerWidth) * 140;
        currentAngle = baseAngle + angleShift;
        let borderAngle = (totalTicks / 2) * tickSpacingAngle;
        if (currentAngle > borderAngle) currentAngle = borderAngle;
        if (currentAngle < -borderAngle) currentAngle = -borderAngle;
        dialRotor.style.transform = `rotate(${currentAngle}deg)`;
        let ratio = 0.5 - (currentAngle / (totalTicks * tickSpacingAngle));
        let computedZoom = 1 + ratio * 119;
        currentZoom = parseFloat(Math.max(1.0, Math.min(120.0, computedZoom)).toFixed(1));
        document.getElementById('liveZoomTxt').innerText = currentZoom + "x";
        applyHardwareAndDigitalZoom(currentZoom);
    }, { passive: true });
    curvedPanel.addEventListener('touchend', startCollapseCountdown);

    async function applyHardwareAndDigitalZoom(zoomVal) {
        const video = document.getElementById('videoFeed');
        if (videoTrack) {
            try {
                const caps = videoTrack.getCapabilities();
                if (caps.zoom) {
                    const target = caps.min + ((caps.max - caps.min) * (Math.min(zoomVal, caps.max) / caps.max));
                    await videoTrack.applyConstraints({ advanced: [{ zoom: target }] });
                }
            } catch(e) {}
        }
        let scaleStr = `scale(${zoomVal})`;
        if (facingModeSetting === "user") { scaleStr += ` scaleX(-1)`; }
        video.style.transform = scaleStr;
    }

    function switchCameraMode(targetMode) {
        if(isRecording) return;
        activeMode = targetMode;
        document.getElementById('mode-video').classList.toggle('active', targetMode === 'VIDEO');
        document.getElementById('mode-photo').classList.toggle('active', targetMode === 'PHOTO');
        document.getElementById('btnCapture').style.display = (targetMode === 'PHOTO') ? 'block' : 'none';
        document.getElementById('btnRecord').style.display = (targetMode === 'VIDEO') ? 'block' : 'none';
    }

    let activeStream = null, videoTrack = null, isFlashOn = false, mediaRecorder = null, recordedChunks = [], isRecording = false;

    async function startCamera() {
        if (activeStream) { stopCamera(); }
        const video = document.getElementById('videoFeed');
        const mode = document.getElementById('resSelector').value;
        let w = 1920, h = 1080;
        if (mode === '8K') { w = 7680; h = 4320; }
        else if (mode === '4K') { w = 3840; h = 2160; }

        try {
            activeStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: facingModeSetting }, width: { ideal: w }, height: { ideal: h } },
                audio: true 
            });
            video.srcObject = activeStream;
            videoTrack = activeStream.getVideoTracks()[0];
            if (facingModeSetting === "user") { video.classList.add('mirror-mode'); } else { video.classList.remove('mirror-mode'); }
            const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            document.getElementById('btnFlash').disabled = !caps.torch;
            switchCameraMode(activeMode);
            applyHardwareAndDigitalZoom(currentZoom);
        } catch (err) {}
    }

    function stopCamera() {
        if (activeStream) { activeStream.getTracks().forEach(track => track.stop()); activeStream = null; }
        videoTrack = null; isFlashOn = false;
        document.getElementById('videoFeed').srcObject = null;
    }

    function toggleCamPower() { if (activeStream) { stopCamera(); document.getElementById('btnCamPower').classList.remove('active'); } else { startCamera(); document.getElementById('btnCamPower').classList.add('active'); } }
    function restartStream() { if (activeStream) startCamera(); }
    function flipCameraFacing() { facingModeSetting = (facingModeSetting === "environment") ? "user" : "environment"; if (activeStream) startCamera(); }

    async function toggleFlash() {
        if (!videoTrack) return;
        try {
            isFlashOn = !isFlashOn;
            await videoTrack.applyConstraints({ advanced: [{ torch: isFlashOn }] });
            document.getElementById('btnFlash').classList.toggle('active', isFlashOn);
        } catch (e) {}
    }

    function toggleFullscreen() { document.getElementById('cameraBox').classList.toggle('is-fullscreen'); }

    function takePhoto() {
        if (!activeStream) return;
        const video = document.getElementById('videoFeed');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        if (facingModeSetting === "user") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
        mediaItems.unshift({ id: Date.now(), type: 'PHOTO', src: dataUrl });
        updateAlbumPreview();
    }

    function toggleRecording() {
        if (!activeStream) return;
        const btn = document.getElementById('btnRecord');
        if (!isRecording) {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(activeStream, { mimeType: 'video/mp4' });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);
                mediaItems.unshift({ id: Date.now(), type: 'VIDEO', src: videoUrl });
                updateAlbumPreview();
            };
            mediaRecorder.start(); isRecording = true; btn.classList.add('recording');
        } else {
            mediaRecorder.stop(); isRecording = false; btn.classList.remove('recording');
        }
    }

    function updateAlbumPreview() {
        const preview = document.getElementById('albumPreview');
        if (mediaItems.length > 0) preview.style.backgroundImage = `url('${mediaItems[0].src}')`;
    }

    function openGalleryModal() { renderGalleryGrid(); document.getElementById('galleryModal').style.display = 'flex'; }
    function closeGalleryModal() { document.getElementById('galleryModal').style.display = 'none'; }
    function renderGalleryGrid() {
        const grid = document.getElementById('galleryGrid'); grid.innerHTML = '';
        mediaItems.forEach(item => {
            const div = document.createElement('div'); div.className = 'gallery-item';
            div.innerHTML = item.type === 'PHOTO' ? `<img src="${item.src}">` : `<video src="${item.src}"></video>`;
            grid.appendChild(div);
        });
    }

    // ==========================================
    // GIỮ NGUYÊN TOÀN BỘ LOGIC CŨ 100%
    // ==========================================
    function toggleSearchContainer() {
        const box = document.getElementById('searchContainer');
        if (box.style.display === 'flex') {
            closeSearchContainer();
        } else {
            box.style.display = 'flex';
            document.getElementById('btnToggleSearch').classList.add('active');
        }
    }

    function closeSearchContainer() {
        document.getElementById('searchContainer').style.display = 'none';
        document.getElementById('btnToggleSearch').classList.remove('active');
    }

    function handleBlankClick(event) {
        closeSearchContainer();
    }

    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            const data = new Uint8Array(evt.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
            if (json.length > 0) {
                originalExcelHeaders = json[0].map(h => h || '');
                originalExcelRows = json.slice(1).filter(row => row.length > 0);
                
                document.getElementById('uploadBox').classList.add('hidden');
                document.getElementById('tableSection').style.display = 'block';
                filterData();
            }
        };
        reader.readAsArrayBuffer(file);
    });

    function toggleSTTMode() {
        isSTTActive = !isSTTActive;
        document.getElementById('btnSTT').classList.toggle('active', isSTTActive);
        filterData();
    }

    function toggleGroupMode() {
        isGroupActive = !isGroupActive;
        document.getElementById('btnGroup').classList.toggle('active', isGroupActive);
        filterData();
    }

    function filterData() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        let rows = [...originalExcelRows];

        if (keyword !== '') {
            rows = rows.filter(row => {
                return row.some(cell => String(cell || '').toLowerCase().includes(keyword));
            });
        }

        if (isGroupActive) {
            let map = new Map();
            rows.forEach(row => {
                let key = row.map(c => String(c || '').trim()).join('|');
                if (!map.has(key)) map.set(key, row);
            });
            rows = Array.from(map.values());
        }

        renderExcelTable(rows);
    }

    function renderExcelTable(rows) {
        const head = document.getElementById('tHead'); 
        const body = document.getElementById('tBody');
        head.innerHTML = ''; body.innerHTML = '';

        if (originalExcelHeaders.length === 0) return;

        let hRow = '<tr>';
        if (isSTTActive) {
            hRow += '<th>STT</th>';
        }
        originalExcelHeaders.forEach(h => {
            hRow += `<th>${h}</th>`;
        });
        hRow += '</tr>';
        head.innerHTML = hRow;

        rows.forEach((row, index) => {
            let bRow = '<tr>';
            if (isSTTActive) {
                bRow += `<td style="font-weight: bold; color: var(--ios-blue); background: #f9f9f9;">${index + 1}</td>`;
            }
            for(let i = 0; i < originalExcelHeaders.length; i++) {
                bRow += `<td>${row[i] !== undefined ? row[i] : ''}</td>`;
            }
            bRow += '</tr>';
            body.innerHTML += bRow;
        });
    }

    window.onload = () => { buildDialTicks(); startCamera(); };
</script>
</body>
</html>
